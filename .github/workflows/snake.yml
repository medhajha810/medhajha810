name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Snake and contribution dots use the cosmic palette: indigo → magenta → gold
          outputs: |
            dist/snake.svg?color_snake=%23C850C0&color_dots=%23ebedf0,%23cdd9f5,%234158D0,%23C850C0,%23FFCC70
            dist/snake-dark.svg?color_snake=%23C850C0&color_dots=%23161b22,%231f2a5e,%234158D0,%23C850C0,%23FFCC70

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
